<!DOCTYPE html>
<!--
  index.html
  ===========================================================================
  PROPOSITO:
    Unico archivo HTML de la aplicacion (Single Page Application).
    Toda la interfaz se renderiza dinamicamente con JavaScript dentro del
    contenedor <div id="app">. No hay recargas de pagina: el router cambia
    el contenido segun el hash de la URL (#/login, #/admin/dashboard, etc).

  RESPONSABILIDADES:
    - Definir metadatos basicos y viewport (responsive).
    - Cargar la hoja de estilos principal.
    - Exponer el contenedor raiz #app donde el JS inyecta las vistas.
    - Cargar main.js como modulo ES (type="module"), punto de entrada.
  ===========================================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: clave para el diseno responsive (escala correcta en movil). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Seguridad (docs/SEGURIDAD-PORTAL.md):
      - CSP: solo corre el codigo del propio portal (y la libreria de QR de
        cdnjs, con integridad). Nada de <script> en linea ni onclick="": si un
        dato malicioso lograra colarse en la pagina, el navegador no lo ejecuta.
        Estilos en linea si (la interfaz los usa); fuentes de Google; imagenes
        propias, data:, blob: y https (banners); descargas y visor de PDF con
        blob:; conexiones solo al mismo sitio (/api).
        frame-ancestors no funciona en <meta>: lo pone el servidor (cabecera).
      - Referrer: a otros sitios (WhatsApp, pasarela) no se les dice desde que
        pagina del portal se llego.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="same-origin" />
    <meta
      name="description"
      content="CS Travel Group - Plataforma de gestion de viajes corporativos para empresas aliadas."
    />
    <title>CS Travel Group | Viajes Corporativos</title>
    <!-- Favicon del portal. En producción (/portal-app/) resuelve a
         cstravelgroup.com/portal-assets/logo-cs.png. -->
    <link rel="icon" type="image/png" href="/portal-assets/logo-cs.png" />
    <link rel="apple-touch-icon" href="/portal-assets/logo-cs.png" />
    <!--
      La hoja de estilos principal se importa desde src/main.js
      (import './styles/main.css'), que es la forma idiomatica en Vite y
      garantiza que funcione tanto en desarrollo como en el build de produccion.
    -->
  </head>
  <body>
    <!--
      Contenedor raiz de la SPA.
      El router (src/router/router.js) escribe aqui el HTML de cada vista.
    -->
    <div id="app"></div>

    <!--
      Punto de entrada de la aplicacion.
      type="module" habilita import/export de ES Modules en el navegador.
    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
